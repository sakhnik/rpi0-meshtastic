require conf/distro/poky.conf

DISTRO = "mydistro"
DISTRO_NAME = "RPi Meshtasticd Distro"
DISTRO_VERSION = "1.0"

DISTRO_FEATURES:remove = " bluetooth systemd"
DISTRO_FEATURES:append = " wifi sysvinit"

VIRTUAL-RUNTIME_init_manager = "sysvinit"
VIRTUAL-RUNTIME_initscripts = "sysvinit"

PACKAGE_CLASSES = "package_ipk"

hostname:forcevariable = "meshtastic"
